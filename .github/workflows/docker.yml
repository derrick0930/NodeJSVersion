name: build-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 16, os: bullseye }
          - { node: 17, os: bullseye }
          - { node: 18, os: bullseye }
          - { node: 19, os: bullseye }
          - { node: 20, os: bookworm }
          - { node: 21, os: bookworm }
          - { node: 22, os: bookworm }
          - { node: 23, os: bookworm }
          - { node: 24, os: bookworm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            DEBIAN=${{ matrix.os }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs:${{ matrix.node }}
            ${{ matrix.node == 24 && format('{0}/nodejs:latest', secrets.DOCKERHUB_USERNAME) || '' }}
